services:
  scout:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./weights.yaml:/app/weights.yaml
    environment:
      - SCOUT_DEVICE=${SCOUT_DEVICE:-cuda}
      - SCOUT_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
