[project]
name = "scout-trainer"
version = "0.1.0"
description = "AI football scouting for youth players: detect, track, identify, and rate kids from match video, per position."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# GPU perception stack — install on the machine that processes video
perception = [
    "ultralytics>=8.2",
    "supervision>=0.25",
    "opencv-python>=4.9",
    "torch>=2.2",
    "easyocr>=1.7",
    "scikit-learn>=1.4",
    "yt-dlp>=2024.4.9",
    "ffmpeg-python>=0.2",
]
# Coach-facing dashboard
ui = [
    "streamlit>=1.35",
    "plotly>=5.20",
    "mplsoccer>=1.4",
    "matplotlib>=3.8",
]
# LLM scouting notes
llm = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = ["scout-trainer[perception,ui,llm,dev]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
